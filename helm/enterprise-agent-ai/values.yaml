# Default values for enterprise-agent-ai Helm Chart.
global:
  environment: production
  imageRegistry: ghcr.io
  imagePullPolicy: IfNotPresent

agentApi:
  replicaCount: 2
  image:
    repository: enterprise-ai/agent-api
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

llmEvaluator:
  replicaCount: 1
  image:
    repository: enterprise-ai/llm-evaluator
    tag: latest
  service:
    type: ClusterIP
    port: 8001
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

gateway:
  replicaCount: 2
  image:
    repository: enterprise-ai/gateway
    tag: latest
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ai.enterprise.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: enterprise-ai-tls
      hosts:
        - ai.enterprise.internal

openshift:
  enabled: false
  route:
    termination: edge

postgresql:
  enabled: true
  auth:
    database: enterprise_ai
    username: ai_user
