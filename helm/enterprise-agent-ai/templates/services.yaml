apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agent-api
  labels:
    app.kubernetes.io/name: agent-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.agentApi.service.type }}
  ports:
    - port: {{ .Values.agentApi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: agent-api
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
