apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent-api
  labels:
    app.kubernetes.io/name: agent-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.agentApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: agent-api
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.agentApi.image.repository }}:{{ .Values.agentApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agentApi.resources | nindent 12 }}
