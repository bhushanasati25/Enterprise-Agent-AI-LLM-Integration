apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-api
        namespace: enterprise-ai
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: agent-api
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway
        namespace: enterprise-ai
      spec:
        replicas: 1
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: enterprise-ai-config
        namespace: enterprise-ai
      data:
        ENVIRONMENT: "development"
        LOG_LEVEL: "DEBUG"

labels:
  - pairs:
      environment: development
