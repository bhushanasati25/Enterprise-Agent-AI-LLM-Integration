apiVersion: v1
kind: ResourceQuota
metadata:
  name: enterprise-ai-quota
  namespace: enterprise-ai
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "30"
    services: "10"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: enterprise-ai-limits
  namespace: enterprise-ai
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
    - type: Pod
      max:
        cpu: "8"
        memory: 8Gi
