apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-evaluator
  namespace: enterprise-ai
  labels:
    app: llm-evaluator
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-evaluator
  template:
    metadata:
      labels:
        app: llm-evaluator
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: llm-evaluator
          image: enterprise-ai/llm-evaluator:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: enterprise-ai-config
            - secretRef:
                name: enterprise-ai-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-evaluator
  namespace: enterprise-ai
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: llm-evaluator
