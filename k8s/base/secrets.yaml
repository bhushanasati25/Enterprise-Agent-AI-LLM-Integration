# IMPORTANT: Replace placeholder values before deploying.
# In production, use a secrets management tool (e.g., Sealed Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-ai-secrets
  namespace: enterprise-ai
type: Opaque
stringData:
  POSTGRES_USER: "enterprise"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  DATABASE_URL: "postgresql+asyncpg://enterprise:CHANGE_ME_IN_PRODUCTION@postgres:5432/enterprise_ai"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
  JWT_SECRET_KEY: "CHANGE_ME_generate_a_256_bit_key"
