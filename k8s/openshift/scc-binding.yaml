# OpenShift Security Context Constraints & ServiceAccount Bindings
# Ensures compliance with OpenShift restricted-v2 SCC standard
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enterprise-ai-sa
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/part-of: enterprise-agent-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enterprise-ai-restricted-scc-binding
  namespace: enterprise-ai
subjects:
  - kind: ServiceAccount
    name: enterprise-ai-sa
    namespace: enterprise-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:restricted-v2
