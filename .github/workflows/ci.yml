name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------------
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint Agent API
        run: ruff check services/agent-api/
      - name: Lint Evaluator
        run: ruff check services/llm-evaluator/

  lint-csharp:
    name: Lint C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore & format check
        working-directory: services/gateway
        run: |
          dotnet restore
          dotnet format --verify-no-changes

  # -------------------------------------------------------------------------
  # Test
  # -------------------------------------------------------------------------
  test-agent-api:
    name: Test Agent API
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/agent-api
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: services/agent-api
        env:
          ENVIRONMENT: testing
          DEFAULT_LLM_PROVIDER: mock
        run: pytest tests/ -v --cov=app --cov-report=xml --tb=short
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: agent-api-coverage
          path: services/agent-api/coverage.xml

  test-evaluator:
    name: Test LLM Evaluator
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/llm-evaluator
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: services/llm-evaluator
        env:
          ENVIRONMENT: testing
          DEFAULT_LLM_PROVIDER: mock
        run: pytest tests/ -v --cov=app --cov-report=xml --tb=short
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-coverage
          path: services/llm-evaluator/coverage.xml

  test-gateway:
    name: Test Gateway
    runs-on: ubuntu-latest
    needs: lint-csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        working-directory: services/gateway
        run: dotnet build --no-restore || dotnet restore && dotnet build

  # -------------------------------------------------------------------------
  # Build Docker Images
  # -------------------------------------------------------------------------
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-agent-api, test-evaluator, test-gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: agent-api
            context: services/agent-api
          - name: llm-evaluator
            context: services/llm-evaluator
          - name: gateway
            context: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Deploy to Dev
  # -------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-images
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to dev
        run: |
          kubectl apply -k k8s/overlays/dev/
          kubectl -n enterprise-ai rollout status deployment/dev-agent-api --timeout=120s
          kubectl -n enterprise-ai rollout status deployment/dev-gateway --timeout=120s
      - name: Verify deployment
        run: |
          kubectl -n enterprise-ai get pods
          kubectl -n enterprise-ai get services

  # -------------------------------------------------------------------------
  # Deploy to Production (manual approval)
  # -------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: production  # Requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to production
        run: |
          kubectl apply -k k8s/overlays/prod/
          kubectl -n enterprise-ai rollout status deployment/prod-agent-api --timeout=180s
          kubectl -n enterprise-ai rollout status deployment/prod-gateway --timeout=180s
      - name: Smoke test
        run: |
          GATEWAY_URL=$(kubectl -n enterprise-ai get svc prod-gateway -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -sf "http://${GATEWAY_URL}:8080/health" || echo "Health check pending — service may need time to start"
